<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay BLOODSITAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body.verde{background:#00FF00}
#escena{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  font-family:"M PLUS Rounded 1c", system-ui, "Segoe UI", sans-serif}

/* La capa exterior maneja posición, tamaño y capa; .cuerpo maneja la entrada y salida */
.el{position:absolute;left:0;top:0;transform-origin:50% 50%;visibility:visible;
  transition:transform .14s linear, opacity .25s ease, visibility 0s}
/* Al terminar de desvanecerse, el elemento sale del dibujado: oculto no cuesta nada */
.el:not(.on){visibility:hidden;transition:transform .14s linear, opacity .25s ease, visibility 0s linear .5s}
.cuerpo{width:100%;height:100%;opacity:0;transform:scale(.86);
  transition:opacity .3s ease, transform .45s cubic-bezier(.2,1.4,.4,1)}
.el.on .cuerpo{opacity:1;transform:scale(1)}
body.guias .el{outline:3px dashed #FF007F}

/* Tarjeta temporal mientras se implementa cada módulo */
.prueba{position:relative;width:100%;height:100%;box-sizing:border-box;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14px);
  padding:calc(var(--u)*30px);text-align:center;color:#FFFFFF;
  background:rgba(13,13,13,.9);border:calc(var(--u)*6px) solid #FF007F;border-radius:calc(var(--u)*34px);
  box-shadow:inset 0 0 0 calc(var(--u)*3px) #FFC2DC, 0 0 40px rgba(255,0,127,.45)}
.prueba-titulo{font-size:calc(var(--u)*68px);font-weight:800;color:#FFC2DC;line-height:1.1}
.prueba-sub{font-size:calc(var(--u)*46px);font-weight:700;line-height:1.1}
.prueba-nota{font-size:calc(var(--u)*22px);color:rgba(255,255,255,.6)}
.petalo{position:absolute;background:#FFC2DC;border-radius:0 70% 0 70%;opacity:.85;
  width:calc(var(--u)*38px);height:calc(var(--u)*38px)}
.p1{top:calc(var(--u)*24px);left:calc(var(--u)*28px);transform:rotate(-20deg)}
.p2{top:calc(var(--u)*48px);left:calc(var(--u)*78px);transform:rotate(35deg) scale(.55)}
.p3{bottom:calc(var(--u)*24px);right:calc(var(--u)*28px);transform:rotate(160deg)}
.p4{bottom:calc(var(--u)*48px);right:calc(var(--u)*78px);transform:rotate(200deg) scale(.55)}

/* Imagen */
.imagen{display:block;width:100%;height:100%;object-fit:contain}

/* Ruleta */
.ruleta{position:relative;width:100%;height:100%}
.rueda{position:absolute;inset:0;width:100%;height:100%;will-change:transform;filter:drop-shadow(0 0 18px rgba(255,0,127,.45))}
.puntero{position:absolute;left:50%;top:-3%;width:9%;transform:translateX(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));z-index:2}
.eje{position:absolute;left:50%;top:50%;width:12%;height:12%;transform:translate(-50%,-50%);border-radius:50%;box-sizing:border-box;
  background:#0D0D0D;border:calc(var(--u)*7px) solid #FFC2DC;box-shadow:0 0 0 calc(var(--u)*5px) #FF007F}
.ganador{position:absolute;left:50%;top:50%;width:76%;box-sizing:border-box;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10px);text-align:center;
  padding:calc(var(--u)*30px) calc(var(--u)*30px);border-radius:calc(var(--u)*32px);
  background:rgba(13,13,13,.95);border:calc(var(--u)*7px) solid #FF007F;
  box-shadow:inset 0 0 0 calc(var(--u)*3px) #FFC2DC, 0 0 60px rgba(255,0,127,.65);
  opacity:0;transform:translate(-50%,-50%) scale(.55);transition:opacity .3s ease, transform .55s cubic-bezier(.2,1.5,.4,1)}
.ganador.ver{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ganador span{color:#FFC2DC;font-weight:700;font-size:calc(var(--u)*36px)}
.ganador strong{color:#FFFFFF;font-weight:800;font-size:calc(var(--u)*76px);line-height:1.1;overflow-wrap:anywhere}

/* Randoms con cartas (killer, survi, Marvel) */
.tirada{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.tirada-vacia{color:#FFC2DC;font-weight:800;font-size:calc(var(--u)*48px);text-shadow:0 2px 8px #000}
.carta{display:flex;flex-direction:column;align-items:center;flex:none}
.marco{position:relative;width:100%;box-sizing:border-box;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%, #2a1520 0%, #0D0D0D 70%);
  border:4px solid #FFC2DC;box-shadow:0 10px 26px rgba(0,0,0,.6);transition:border-color .25s, box-shadow .25s}
.ventana{position:absolute;inset:0;overflow:hidden}
.ventana.girando{animation:desenfoque var(--dur) linear forwards}
@keyframes desenfoque{0%{filter:none}10%{filter:blur(2.5px)}70%{filter:blur(1.2px)}100%{filter:none}}
.tira{will-change:transform}
.cuadro{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:3%}
.cuadro img{width:100%;height:100%;object-fit:contain;display:block}
.cuadro span{display:none;color:#FFFFFF;font-weight:800;text-align:center;line-height:1.15;font-size:16px}
.cuadro.sin-img span{display:block}
/* Sombra arriba y abajo de la ventana, como un tragamonedas */
.marco::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .4s;
  background:linear-gradient(to bottom, rgba(13,13,13,.75), transparent 24%, transparent 76%, rgba(13,13,13,.75))}
/* Destello que cruza la carta al frenar */
.marco::before{content:'';position:absolute;top:-10%;bottom:-10%;left:0;width:45%;z-index:3;pointer-events:none;opacity:0;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);transform:translateX(-150%) skewX(-12deg)}
.carta.lista .marco{border-color:#FF007F;box-shadow:inset 0 0 0 3px #FFC2DC, 0 0 30px rgba(255,0,127,.75);animation:golpe .45s cubic-bezier(.2,1.6,.4,1)}
.carta.lista .marco::after{opacity:0}
.carta.lista .marco::before{animation:destello .8s ease-out .05s}
@keyframes golpe{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes destello{0%{opacity:1;transform:translateX(-150%) skewX(-12deg)}100%{opacity:0;transform:translateX(320%) skewX(-12deg)}}
/* Nombre del personaje: grande y claro */
.nombre{margin-top:14px;max-width:125%;box-sizing:border-box;padding:6px 18px;border-radius:999px;text-align:center;
  background:rgba(13,13,13,.92);border:2px solid #FF007F;color:#FFFFFF;font-weight:800;line-height:1.12;overflow-wrap:anywhere;
  opacity:0;transform:translateY(10px);transition:opacity .35s ease, transform .35s ease}
.nombre small{display:block;color:#FFC2DC;font-weight:700;font-size:.62em;margin-top:2px}
.nombre:not(.perk){white-space:nowrap;max-width:170%;overflow:hidden;text-overflow:ellipsis}
/* Nombre de perk: más sutil, máximo dos líneas para que no choquen */
.nombre.perk{width:100%;max-width:100%;margin-top:10px;padding:0;border:0;border-radius:0;background:none;
  font-weight:700;color:rgba(255,255,255,.92);line-height:1.18;text-shadow:0 1px 3px #000, 0 0 8px rgba(0,0,0,.85);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.36em}
.sin-nombres-perk .nombre.perk{visibility:hidden}
.carta.en-espera .nombre,.carta.en-espera .voto{visibility:hidden}
.carta.en-espera .marco{border-color:#FFC2DC}
.en-espera .cuadro.sin-img span{font-size:64px;color:#FFC2DC}
.carta.lista .nombre{opacity:1;transform:none}

/* Votación de killer */
.vot{width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.vot .tirada{height:auto}
.vot-cab{display:flex;align-items:center;gap:18px;min-height:96px}
.reloj{position:relative;width:92px;height:92px;display:none;flex:none}
.fase-votando .reloj{display:block}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj circle{fill:none;stroke-width:8}
.reloj .pista{fill:rgba(13,13,13,.92);stroke:rgba(255,194,220,.3)}
.reloj .avance{stroke:#FF007F;stroke-linecap:round;stroke-dasharray:251.33;stroke-dashoffset:0}
@keyframes cuenta{to{stroke-dashoffset:251.33}}
.reloj span{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:#FFFFFF}
.reloj.urgente span{color:#FFC2DC;animation:latidoNum 1s ease-in-out infinite}
@keyframes latidoNum{50%{transform:scale(1.15)}}
.vot-estado{font-size:34px;font-weight:800;color:#FFFFFF;background:rgba(13,13,13,.92);border:3px solid #FF007F;border-radius:999px;padding:10px 30px;
  box-shadow:0 0 24px rgba(255,0,127,.45)}
.fase-ganador .vot-estado{background:#FF007F;border-color:#FFC2DC}
.letra{position:absolute;top:8px;left:8px;z-index:4;width:24%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:#FF007F;color:#FFFFFF;font-weight:800;box-shadow:0 0 0 3px #FFC2DC, 0 4px 10px rgba(0,0,0,.6)}
.voto{width:100%;margin-top:12px;display:flex;align-items:center;gap:10px}
.sin-votos .pct small{display:none}
.barra{flex:1;height:14px;border-radius:999px;background:rgba(13,13,13,.88);border:2px solid rgba(255,194,220,.55);overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#FF007F,#FFC2DC);transform-origin:left center;transform:scaleX(0);transition:transform .45s ease}
.pct{min-width:3.6em;text-align:right;font-size:26px;font-weight:800;color:#FFFFFF;line-height:1;text-shadow:0 1px 3px #000, 0 0 8px rgba(0,0,0,.8)}
.pct small{display:block;margin-top:3px;font-size:.5em;font-weight:700;color:#FFC2DC}
.vot .carta{transition:filter .12s, transform .15s ease-out}
.fase-ganador .carta{transition:filter .4s, transform .5s cubic-bezier(.2,1.5,.4,1)}
.vot .carta.apagada{filter:grayscale(.85) brightness(.4)}
.fase-desempate .carta:not(.luz):not(.apagada){filter:brightness(.55)}
.vot .carta.empata .marco{border-color:#FFFFFF;animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{box-shadow:0 0 0 3px #FF007F, 0 0 36px rgba(255,0,127,.85)}}
.vot .carta.luz{filter:none;transform:scale(1.05)}
.vot .carta.luz .marco{border-color:#FFFFFF;box-shadow:0 0 0 4px #FF007F, 0 0 48px rgba(255,255,255,.9)}
.vot .carta.gana{transform:translateY(-14px) scale(1.07)}
.vot .carta.gana .marco{border-color:#FFFFFF;box-shadow:inset 0 0 0 3px #FF007F, 0 0 0 4px #FF007F, 0 0 60px rgba(255,0,127,.95)}

/* Chat en el overlay */
.chatov{width:100%;height:100%;box-sizing:border-box;padding:16px 18px;border-radius:26px;overflow:hidden;
  background:rgba(13,13,13,.8);border:3px solid #FF007F;box-shadow:inset 0 0 0 2px rgba(255,194,220,.45), 0 0 30px rgba(255,0,127,.35);
  display:flex;flex-direction:column;justify-content:flex-end}
.chatov-lista{display:flex;flex-direction:column;justify-content:flex-end;gap:7px;min-height:0;overflow:hidden;
  font-size:22px;line-height:1.35;color:#FFFFFF;overflow-wrap:anywhere}
.chatov .msg{flex:none;animation:entraMsg .3s ease-out;text-shadow:0 1px 2px #000}
@keyframes entraMsg{from{opacity:0;transform:translateY(10px)}}
.chatov .msg b{font-weight:800}
.chatov .sep{margin-right:2px}
.chatov .insignia{width:22px;height:22px;vertical-align:-4px;margin-right:4px}
.chatov .emote{height:30px;vertical-align:-8px;margin:0 1px}
.chatov .voto-tag{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-left:8px;border-radius:50%;
  background:#FF007F;color:#FFFFFF;font-size:15px;font-weight:800;vertical-align:2px;box-shadow:0 0 0 2px #FFC2DC}

/* Lista para jugar */
.fila-jug{width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:.6em;padding:1.1em 1.1em 1em;color:#FFFFFF;
  border-radius:28px;background:rgba(13,13,13,.88);border:5px solid #FF007F;box-shadow:inset 0 0 0 3px #FFC2DC, 0 0 34px rgba(255,0,127,.4)}
.fila-tit{font-size:1.25em;font-weight:800;color:#FFC2DC;text-align:center;line-height:1.1;padding-bottom:.45em;border-bottom:2px solid rgba(255,194,220,.35)}
.fila-nombres{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.38em}
.fila-nombres li{display:flex;align-items:center;gap:.55em;flex:none;animation:entraMsg .35s ease-out}
.fila-nombres .num{flex:none;width:1.65em;height:1.65em;border-radius:50%;display:grid;place-items:center;font-size:.8em;font-weight:800;
  background:rgba(255,194,220,.18);color:#FFC2DC;border:2px solid rgba(255,194,220,.5)}
.fila-nombres .nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-nombres li.primero{background:#FF007F;border-radius:999px;padding:.25em .9em .25em .3em;box-shadow:0 0 18px rgba(255,0,127,.6)}
.fila-nombres li.primero .num{background:#FFFFFF;color:#FF007F;border-color:#FFFFFF}
.fila-nombres li.primero .nom{font-weight:800}
.fila-nombres .vacia{color:rgba(255,255,255,.55);font-weight:700;justify-content:center}
.fila-nombres .mas{color:#FFC2DC;font-weight:700;font-size:.85em;justify-content:center}

/* Horóscopo */
.horo{--k:1;position:relative;width:100%;height:100%;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:calc(var(--k)*18px);
  padding:calc(var(--k)*34px) calc(var(--k)*38px);color:#FFFFFF;border-radius:34px;
  background:rgba(13,13,13,.92);border:6px solid #FF007F;box-shadow:inset 0 0 0 3px #FFC2DC, 0 0 40px rgba(255,0,127,.45)}
.horo-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:2px solid rgba(255,194,220,.35);padding-bottom:calc(var(--k)*14px)}
.horo-signo{font-size:calc(var(--k)*62px);font-weight:800;color:#FFC2DC;line-height:1}
.horo-fecha{font-size:calc(var(--k)*20px);color:rgba(255,255,255,.65);margin-top:6px}
.horo-clave{flex:none;font-size:calc(var(--k)*20px);font-weight:800;background:#FF007F;border-radius:999px;padding:8px 20px}
.horo-general{margin:0;font-size:calc(var(--k)*28px);font-weight:700;line-height:1.35}
.horo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--k)*18px)}
.horo-grid h4{margin:0 0 6px;font-size:calc(var(--k)*17px);font-weight:800;color:#FFC2DC;text-transform:uppercase;letter-spacing:.06em}
.horo-grid p{margin:0;font-size:calc(var(--k)*20px);line-height:1.4;color:rgba(255,255,255,.9)}
.horo-suerte{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 26px;font-size:calc(var(--k)*19px);color:rgba(255,255,255,.85)}
.horo-suerte b{color:#FFC2DC;margin-right:6px}

@media (prefers-reduced-motion:reduce){.el,.cuerpo,.ganador{transition:none}}
</style>
</head>
<body>
<div id="escena"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/*CONFIG-BEGIN*/
// Pega aquí la misma configuración de Firebase que en panel.html.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBTo0aaqsTK7ucs7yaq5ONpd0OOSXqAvy0",
  authDomain: "bloodsitax-panel.firebaseapp.com",
  databaseURL: "https://bloodsitax-panel-default-rtdb.firebaseio.com",
  projectId: "bloodsitax-panel",
  storageBucket: "bloodsitax-panel.firebasestorage.app",
  messagingSenderId: "1066841366963",
  appId: "1:1066841366963:web:ee0559a51871aa191e6bc6"
};
// Sala fija: debe ser exactamente igual en panel.html y overlay.html.
const SALA_FIJA = "bloodsitax";
const ESTADO_INICIAL = null;
/*CONFIG-END*/

const params = new URLSearchParams(location.search);
const sala = params.get('sala') || SALA_FIJA;
if(params.get('fondo') === 'verde') document.body.classList.add('verde');
if(params.get('guias') === '1') document.body.classList.add('guias');

const escena = document.getElementById('escena');
function ajustar(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  escena.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', ajustar);
ajustar();

let elementos = ESTADO_INICIAL || {}, desfase = 0, fuentesListas = 0, db = null;
const LIBERAR_MS = 60000; // tras 1 minuto oculto, se libera la memoria de sus imágenes
const ahora = () => Date.now() + desfase;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Tarjeta de prueba ---------- */
function tarjetaPrueba(c, e){
  const sub = e.datos ? (e.datos.signo || e.datos.accion || '') : '';
  c.innerHTML = `<div class="prueba">
    <span class="petalo p1"></span><span class="petalo p2"></span><span class="petalo p3"></span><span class="petalo p4"></span>
    <div class="prueba-titulo">${esc(e.nombre)}</div>
    ${sub && sub !== e.nombre ? `<div class="prueba-sub">${esc(sub)}</div>` : ''}
    <div class="prueba-nota">Vista de prueba</div>
  </div>`;
}

/* ---------- Ruleta ---------- */
const COLORES = [['#FF007F','#FFFFFF'], ['#FFC2DC','#0D0D0D'], ['#0D0D0D','#FFFFFF']];
function recortar(ctx, t, max){
  if(ctx.measureText(t).width <= max) return t;
  while(t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}
function dibujarRueda(cv, ops, tam, estilo){
  const rosa = estilo === 'rosa';
  const S = Math.round(tam * 1.5);
  cv.width = S; cv.height = S;
  const x = cv.getContext('2d'), c = S / 2, R = c * .94, n = ops.length;
  x.clearRect(0, 0, S, S);
  if(!n){
    x.beginPath(); x.arc(c, c, R, 0, Math.PI * 2); x.fillStyle = '#0D0D0D'; x.fill();
    x.font = `800 ${S * .05}px "M PLUS Rounded 1c", system-ui, sans-serif`;
    x.fillStyle = '#FFC2DC'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('Lista vacía', c, c + R * .45);
  } else {
    const seg = Math.PI * 2 / n;
    const col = ops.map((_, i) => i % 3);
    if(n > 1 && col[n - 1] === col[0]) col[n - 1] = col[n - 2] === 1 ? 2 : 1;
    const fs = Math.max(S * .012, Math.min(R * .085, R * seg * .42));
    for(let i = 0; i < n; i++){
      const a = -Math.PI / 2 + i * seg;
      x.beginPath(); x.moveTo(c, c); x.arc(c, c, R, a, a + seg); x.closePath();
      x.fillStyle = rosa ? '#FFC2DC' : COLORES[col[i]][0]; x.fill();
      if(n > 1){ x.lineWidth = S * (rosa ? .005 : .003); x.strokeStyle = rosa ? '#FF007F' : '#0D0D0D'; x.stroke(); }
      x.save();
      x.translate(c, c); x.rotate(a + seg / 2);
      x.font = `800 ${fs}px "M PLUS Rounded 1c", system-ui, sans-serif`;
      x.textAlign = 'right'; x.textBaseline = 'middle'; x.fillStyle = rosa ? '#0D0D0D' : COLORES[col[i]][1];
      x.fillText(recortar(x, String(ops[i]), R * .66), R * .9, 0);
      x.restore();
    }
  }
  x.beginPath(); x.arc(c, c, R, 0, Math.PI * 2); x.lineWidth = S * .02; x.strokeStyle = '#FF007F'; x.stroke();
  x.beginPath(); x.arc(c, c, R + S * .016, 0, Math.PI * 2); x.lineWidth = S * .008; x.strokeStyle = '#FFC2DC'; x.stroke();
}
function crearRuleta(c){
  c.innerHTML = `<div class="ruleta">
    <canvas class="rueda"></canvas>
    <svg class="puntero" viewBox="0 0 60 70" aria-hidden="true"><path d="M30 64 L7 12 Q30 2 53 12 Z" fill="#FF007F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/></svg>
    <div class="eje"></div>
    <div class="ganador"><span>Ganador</span><strong></strong></div>
  </div>`;
  c._ruleta = { canvas:c.querySelector('canvas'), caja:c.querySelector('.ganador'), firma:'', clave:'', raf:0 };
}
function actualizarRuleta(c, e){
  const r = c._ruleta, d = e.datos || {};
  const ops = Array.isArray(d.opciones) ? d.opciones : Object.values(d.opciones || {});
  const firma = ops.join('\u0001') + '|' + e.w + '|' + fuentesListas + '|' + (e.estilo || '');
  if(firma !== r.firma){ r.firma = firma; dibujarRueda(r.canvas, ops, e.w, e.estilo); }
  const g = d.giro;
  const clave = g ? `g:${g.inicio}:${g.hasta}` : `q:${d.angulo || 0}`;
  if(clave === r.clave) return;
  r.clave = clave;
  cancelAnimationFrame(r.raf);
  if(!g){
    r.caja.classList.remove('ver');
    r.canvas.style.transform = `rotate(${d.angulo || 0}deg)`;
    return;
  }
  r.caja.querySelector('strong').textContent = g.nombre || '';
  const paso = () => {
    const p = Math.min(1, Math.max(0, (ahora() - g.inicio) / g.duracion));
    const ang = g.desde + (g.hasta - g.desde) * (1 - Math.pow(1 - p, 4));
    r.canvas.style.transform = `rotate(${ang}deg)`;
    if(p < 1){ r.caja.classList.remove('ver'); r.raf = requestAnimationFrame(paso); }
    else r.caja.classList.add('ver');
  };
  paso();
}

/* ---------- Imágenes bajo demanda ---------- */
// Nada se descarga hasta que hace falta mostrarlo; lo descargado se guarda en una caché con límite.
const cache = new Map(), MAX_CACHE = 220;
function enCache(k, crear){
  if(cache.has(k)){ const v = cache.get(k); cache.delete(k); cache.set(k, v); return v; }
  const v = crear().catch(() => null);
  cache.set(k, v);
  if(cache.size > MAX_CACHE) cache.delete(cache.keys().next().value);
  return v;
}
function idbGet(k){
  return new Promise(ok => {
    const r = indexedDB.open('bsx-local', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => ok(null);
    r.onsuccess = () => { const q = r.result.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); };
  });
}
function srcRandom(imgId){
  return enCache('r/' + imgId, () => db
    ? db.ref(`overlay/${sala}/imagenes/${imgId}/src`).once('value').then(s => s.val())
    : Promise.resolve(((JSON.parse(localStorage.getItem('bsx-imagenes-' + sala) || '{}'))[imgId] || {}).src || null));
}
function srcCatalogo(r){
  if(r.u) return Promise.resolve(r.u);
  return enCache(r.c + '/' + r.i, () => db
    ? db.ref(`catalogo/${r.c}/img/${r.i}`).once('value').then(s => s.val())
    : idbGet(`img:${r.c}:${r.i}`));
}
function precargar(src){
  return new Promise(ok => { if(!src) return ok(); const i = new Image(); i.onload = i.onerror = () => ok(); i.src = src; });
}
const conLimite = (p, ms) => Promise.race([p, new Promise(ok => setTimeout(ok, ms))]);
const lista = v => Array.isArray(v) ? v.filter(x => x != null) : (v ? Object.values(v) : []);

/* ---------- Randoms con cartas (tragamonedas) ---------- */
// Cada carta es una ventana con una tira vertical de imágenes que se desliza y frena en el resultado.
// Solo se anima transform (y un desenfoque corto en una ventana pequeña), así que es muy ligero.
const PROP = 1.38, ESC_PERK = .85;
const nombreVisible = n => String(n || '').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
const framesDe = k => [...(k.a ? [k.a] : []), ...lista(k.s), ...lista(k.s), k.f]; // la tira se recorre dos veces sin descargar más
const cuadrosHTML = (frames, H) => frames.map(f => `<div class="cuadro" style="height:${H}px"><img alt=""><span>${esc(nombreVisible(f.n))}</span></div>`).join('');
function nombreHTML(k, fsP, fsK){
  return k.p
    ? `<div class="nombre perk" style="font-size:${fsK}px">${esc(nombreVisible(k.f.n))}</div>`
    : `<div class="nombre" style="font-size:${fsP}px">${esc(nombreVisible(k.f.n))}${k.f.g ? `<small>${esc(k.f.g)}</small>` : ''}</div>`;
}
function ponerImagenes(cuadros, frames){
  return conLimite(Promise.all(cuadros.map((q, j) => srcCatalogo(frames[j]).then(src => {
    const img = q.querySelector('img');
    if(src && img){ img.src = src; return precargar(src); }
    if(img) img.remove();
    q.classList.add('sin-img');
  }))), 2500);
}
function girarTira(el, inicio, dur, st){
  const tira = el.querySelector('.tira'), ven = el.querySelector('.ventana');
  const n = tira.children.length, H = tira.firstElementChild.offsetHeight;
  const destino = `translateY(${-(n - 1) * H}px)`;
  el.classList.remove('lista');
  tira.style.transition = 'none';
  if(ahora() > inicio + dur){ tira.style.transform = destino; el.classList.add('lista'); return; }
  tira.style.transform = 'translateY(0)';
  void tira.offsetHeight;
  st.timers.push(setTimeout(() => {
    ven.style.setProperty('--dur', dur + 'ms');
    ven.classList.remove('girando'); void ven.offsetWidth; ven.classList.add('girando');
    tira.style.transition = `transform ${dur}ms cubic-bezier(.1,.75,.18,1.02)`;
    tira.style.transform = destino;
    st.timers.push(setTimeout(() => { ven.classList.remove('girando'); el.classList.add('lista'); }, dur));
  }, Math.max(0, inicio - ahora())));
}
function crearTirada(c){ c.innerHTML = '<div class="tirada"></div>'; c._tirada = { clave:null, token:0, timers:[], rs:[] }; }
function actualizarTirada(c, e){
  const st = c._tirada, d = e.datos, cont = c.firstChild;
  cont.classList.toggle('sin-nombres-perk', !!(e.opc && e.opc.nombresPerks === false));
  const clave = d && d.cartas ? d.t : 0;
  if(clave !== st.clave){
    st.clave = clave; st.token++;
    st.timers.forEach(clearTimeout); st.timers = [];
    if(!clave){ cont.innerHTML = `<div class="tirada-vacia">${esc(e.nombre)}</div>`; st.rs = []; return; }
    st.rs = lista(d.cartas).map(k => k.r || 0);
    armarTirada(cont, e, d, st.token, st);
    return;
  }
  if(!clave) return;
  // Cambio de una sola carta desde el panel
  lista(d.cartas).forEach((k, i) => { const r = k.r || 0; if(r !== st.rs[i]){ st.rs[i] = r; regirar(cont, i, k, st); } });
}
async function armarTirada(cont, e, d, tok, st, modo){
  const vot = modo === 'vot';
  const cartas = lista(d.cartas), PAD = 28, GAP = 26, GAP_PERKS = Math.round(GAP * .3);
  const escalas = cartas.map(k => k.p ? ESC_PERK : 1), suma = escalas.reduce((a, b) => a + b, 0);
  // Entre dos perks la separación es 70% menor; entre el personaje y las perks se mantiene
  const margenes = cartas.map((k, i) => i === 0 ? 0 : (k.p && cartas[i - 1].p ? GAP_PERKS : GAP));
  let W = (e.w - PAD * 2 - margenes.reduce((a, b) => a + b, 0)) / suma;
  W = Math.min(W, (e.h - PAD * 2 - (vot ? 200 : 0)) / (PROP + .34), 360);
  const fsP = Math.max(14, Math.round(W * .115)), fsK = Math.max(12, Math.round(W * ESC_PERK * .075));
  cont.style.gap = '0px';
  cont.innerHTML = cartas.map((k, i) => {
    const w = W * escalas[i], h = w * PROP;
    const letra = vot ? `<div class="letra" style="font-size:${Math.round(w * .13)}px">${'ABCD'[i] || ''}</div>` : '';
    const voto = vot ? '<div class="voto"><div class="barra"><i></i></div><div class="pct">0%</div></div>' : '';
    return `<div class="carta${k.p ? ' es-perk' : ''}${k.e ? ' en-espera' : ''}" style="width:${w}px;margin-left:${margenes[i]}px"><div class="marco" style="height:${h}px"><div class="ventana"><div class="tira">${cuadrosHTML(framesDe(k), h)}</div></div>${letra}</div>${nombreHTML(k, fsP, fsK)}${voto}</div>`;
  }).join('');
  const els = [...cont.querySelectorAll('.carta')];
  // Precarga solo las imágenes de esta tirada
  await Promise.all(els.map((el, i) => ponerImagenes([...el.querySelectorAll('.cuadro')], framesDe(cartas[i]))));
  if(tok !== st.token) return;
  ajustarProporcion(els, cartas);
  // Todas arrancan juntas y frenan en cascada de izquierda a derecha
  els.forEach((el, i) => {
    const k = cartas[i];
    if(k.e) return;
    if(k.r) girarTira(el, k.ini || d.inicio, 1600, st);
    else girarTira(el, d.inicio, 1700 + i * 380, st);
  });
}
// La carta toma la proporción de su imagen final (sin estirarla) para que la imagen llene casi todo el interior.
// Todas las perks de una fila comparten la misma proporción para que se vean parejas.
function ajustarProporcion(els, cartas){
  const aspecto = el => { const im = el.querySelector('.tira > .cuadro:last-child img'); return im && im.naturalWidth ? im.naturalHeight / im.naturalWidth : 0; };
  let aspPerk = 0;
  els.forEach((el, i) => { if(cartas[i].p && !aspPerk) aspPerk = aspecto(el); });
  els.forEach((el, i) => {
    const a = cartas[i].p ? aspPerk : aspecto(el);
    if(!a) return;
    const w = el.offsetWidth, prop = Math.min(1.6, Math.max(.9, a * .94 + .06));
    const h = Math.round(w * prop);
    el.querySelector('.marco').style.height = h + 'px';
    el.querySelectorAll('.cuadro').forEach(q => q.style.height = h + 'px');
  });
}
async function regirar(cont, i, k, st){
  const el = cont.querySelectorAll('.carta')[i]; if(!el) return;
  const tok = st.token, mio = el._tok = (el._tok || 0) + 1;
  const tira = el.querySelector('.tira'), H = tira.firstElementChild.offsetHeight;
  const actual = tira.lastElementChild.cloneNode(true);
  const frames = framesDe(k);
  el.classList.remove('lista');
  tira.style.transition = 'none'; tira.style.transform = 'translateY(0)';
  tira.innerHTML = ''; tira.append(actual);
  tira.insertAdjacentHTML('beforeend', cuadrosHTML(frames, H));
  await ponerImagenes([...tira.children].slice(1), frames);
  if(tok !== st.token || mio !== el._tok) return;
  const nom = el.querySelector('.nombre');
  nom.innerHTML = esc(nombreVisible(k.f.n)) + (!k.p && k.f.g ? `<small>${esc(k.f.g)}</small>` : '');
  girarTira(el, k.ini || ahora(), 1600, st);
}
// Al liberar memoria, cada tira conserva solo su resultado
function liberarTirada(c){
  c.querySelectorAll('.tira').forEach(t => {
    while(t.children.length > 1) t.firstElementChild.remove();
    t.style.transition = 'none'; t.style.transform = 'none';
  });
}

/* ---------- Votación de killer ---------- */
const LETRAS = 'ABCD', VUELTA_RELOJ = 251.33; // perímetro del círculo del temporizador (r = 40)
function crearVotacion(c){
  c.innerHTML = `<div class="vot fase-listo">
    <div class="vot-cab">
      <div class="reloj"><svg viewBox="0 0 92 92" aria-hidden="true"><circle class="pista" cx="46" cy="46" r="40"/><circle class="avance" cx="46" cy="46" r="40"/></svg><span>0</span></div>
      <div class="vot-estado">Votación de killer</div>
    </div>
    <div class="tirada vot-cartas"></div>
  </div>`;
  c._vot = { tir:{ clave:null, token:0, timers:[], rs:[] }, fin:0, seg:0, des:'', desTimers:[] };
}
function actualizarVotacion(c, e){
  const st = c._vot, tir = st.tir, cont = c.querySelector('.vot-cartas'), d = e.datos;
  const clave = d && d.cartas ? d.t : 0;
  if(clave !== tir.clave){
    tir.clave = clave; tir.token++;
    tir.timers.forEach(clearTimeout); tir.timers = [];
    if(!clave){ cont.innerHTML = ''; tir.rs = []; }
    else { tir.rs = lista(d.cartas).map(k => k.r || 0); armarTirada(cont, e, d, tir.token, tir, 'vot'); }
  } else if(clave){
    lista(d.cartas).forEach((k, i) => { const r = k.r || 0; if(r !== tir.rs[i]){ tir.rs[i] = r; regirar(cont, i, k, tir); } });
  }
  c.firstChild.classList.toggle('sin-votos', !!(e.opc && e.opc.verVotos === false));
  aplicarVoto(c, st, e.vot || { fase:'listo' });
}
function aplicarVoto(c, st, v){
  const raiz = c.firstChild, cartas = [...c.querySelectorAll('.vot-cartas .carta')];
  for(const f of ['listo','votando','empate','desempate','ganador']) raiz.classList.toggle('fase-' + f, (v.fase || 'listo') === f);
  const votos = v.votos || {}, tot = LETRAS.split('').reduce((s, l) => s + (votos[l] || 0), 0);
  cartas.forEach((el, i) => {
    const n = votos[LETRAS[i]] || 0, pct = tot ? Math.round(n * 100 / tot) : 0;
    const barra = el.querySelector('.barra i'), p = el.querySelector('.pct');
    if(barra) barra.style.transform = `scaleX(${tot ? n / tot : 0})`;
    if(p) p.innerHTML = `${pct}%<small>${n} ${n === 1 ? 'voto' : 'votos'}</small>`;
    const emp = lista(v.empatados), desL = v.des ? lista(v.des.lista) : [];
    el.classList.toggle('gana', v.fase === 'ganador' && v.ganador === i);
    el.classList.toggle('empata', v.fase === 'empate' && emp.includes(i));
    el.classList.toggle('apagada',
      (v.fase === 'ganador' && v.ganador !== i) || (v.fase === 'empate' && !emp.includes(i)) || (v.fase === 'desempate' && !desL.includes(i)));
  });
  const texto = { listo:'Votación de killer', votando:'Vota en el chat: A, B, C o D', empate:'Empate', desempate:'Desempate', ganador:'Ganador' }[v.fase] || 'Votación de killer';
  raiz.querySelector('.vot-estado').textContent = texto;

  // Temporizador: el círculo se anima solo con CSS y el número se actualiza 4 veces por segundo
  const reloj = raiz.querySelector('.reloj'), num = reloj.querySelector('span'), arco = reloj.querySelector('.avance');
  if(v.fase === 'votando'){
    if(st.fin !== v.fin){
      st.fin = v.fin;
      const dur = v.dur || 20000, pasado = Math.min(dur, Math.max(0, dur - (v.fin - ahora())));
      arco.style.animation = 'none'; void arco.getBoundingClientRect();
      arco.style.animation = `cuenta ${dur}ms linear ${-pasado}ms forwards`;
      clearInterval(st.seg);
      const pintarSeg = () => {
        const s = Math.max(0, Math.ceil((v.fin - ahora()) / 1000));
        num.textContent = s;
        reloj.classList.toggle('urgente', s <= 5);
        if(s <= 0) clearInterval(st.seg);
      };
      pintarSeg(); st.seg = setInterval(pintarSeg, 250);
    }
  } else { clearInterval(st.seg); st.fin = 0; }

  // Desempate: una luz salta entre los empatados, cada vez más lento, y frena en el ganador
  if(v.fase === 'desempate' && v.des){
    const clave = `${v.des.inicio}:${v.des.ganador}`;
    if(st.des !== clave){ st.des = clave; luzDesempate(cartas, v.des, st); }
  } else if(v.fase !== 'ganador'){ st.desTimers.forEach(clearTimeout); st.desTimers = []; st.des = ''; cartas.forEach(el => el.classList.remove('luz')); }
  else cartas.forEach(el => el.classList.remove('luz'));
}
function luzDesempate(cartas, des, st){
  st.desTimers.forEach(clearTimeout); st.desTimers = [];
  const lst = lista(des.lista), L = lst.length, pos = lst.indexOf(des.ganador);
  const tiempos = [];
  for(let t = 0, paso = 60; t < des.dur; t += paso, paso *= 1.12) tiempos.push(t);
  const N = tiempos.length;
  const prender = i => cartas.forEach((el, j) => el.classList.toggle('luz', j === i));
  tiempos.forEach((t, k) => {
    const idx = lst[(((pos - (N - 1 - k)) % L) + L) % L];
    const espera = des.inicio + t - ahora();
    if(espera >= 0) st.desTimers.push(setTimeout(() => prender(idx), espera));
  });
  const final = des.inicio + des.dur - ahora();
  st.desTimers.push(setTimeout(() => {
    prender(-1);
    cartas.forEach((el, j) => { el.classList.toggle('gana', j === des.ganador); el.classList.toggle('apagada', j !== des.ganador); });
  }, Math.max(0, final)));
}

      const div = document.createElement('div');
      div.className = 'msg'; div.innerHTML = html;
      if(tags.id) div.dataset.id = tags.id;
      div.dataset.u = usuario;
      lst.append(div);
      while(lst.children.length > MAX_MENSAJES) lst.firstElementChild.remove();
    });
  }
};
function conEmotes(texto, emotesTag){
  const cps = Array.from(texto), rangos = [];
  (emotesTag || '').split('/').forEach(p => {
    const [id, pos] = p.split(':'); if(!id || !pos) return;
    pos.split(',').forEach(r => { const [a, b] = r.split('-').map(Number); if(!isNaN(a) && !isNaN(b)) rangos.push({ a, b, id }); });
  });
  rangos.sort((x, y) => x.a - y.a);
  let html = '', i = 0;
  for(const r of rangos){
    if(r.a < i) continue;
    html += esc(cps.slice(i, r.a).join(''));
    html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(r.id)}/default/dark/2.0" alt="${esc(cps.slice(r.a, r.b + 1).join(''))}">`;
    i = r.b + 1;
  }
  return html + esc(cps.slice(i).join(''));
}
function crearChat(c){
  c.innerHTML = '<div class="chatov"><div class="chatov-lista"></div></div>';
  ChatOv.listas.add(c.querySelector('.chatov-lista'));
}
function actualizarChat(c, e){ if(e.visible) ChatOv.conectar(); }
function liberarChat(c){ ChatOv.desconectar(); c.querySelector('.chatov-lista').innerHTML = ''; }

/* ---------- Lista para jugar ---------- */
function dibujarLista(c, e){
  const d = e.datos || {}, nombres = lista(d.nombres), titulo = d.titulo ?? 'Siguen en jugar';
  const firma = JSON.stringify([titulo, nombres, e.w, e.h]);
  if(c._firma === firma) return;
  c._firma = firma;
  const fs = Math.round(e.w * .056);
  c.innerHTML = `<div class="fila-jug" style="font-size:${fs}px">
    ${titulo ? `<div class="fila-tit">${esc(titulo)}</div>` : ''}
    <ol class="fila-nombres">${nombres.length
      ? nombres.map((n, i) => `<li class="${i === 0 ? 'primero' : ''}"><span class="num">${i + 1}</span><span class="nom">${esc(n)}</span></li>`).join('')
      : '<li class="vacia">La lista está vacía</li>'}</ol>
  </div>`;
  // Si no caben todos, se muestran los primeros y un aviso de cuántos faltan
  const ol = c.querySelector('.fila-nombres'), items = [...ol.children];
  if(ol.scrollHeight > ol.clientHeight + 1 && nombres.length){
    const mas = document.createElement('li'); mas.className = 'mas'; ol.append(mas);
    let ocultos = 0;
    while(ol.scrollHeight > ol.clientHeight + 1 && items.length - ocultos > 1){
      items[items.length - 1 - ocultos].remove(); ocultos++;
      mas.textContent = `y ${ocultos} más`;
    }
  }
}

/* ---------- Horóscopo ---------- */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaBonita(f){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || '');
  return m ? `${+m[3]} de ${MESES[+m[2] - 1]} de ${m[1]}` : (f || '');
}
function dibujarHoroscopo(c, e){
  const d = e.datos || {}, h = d.h;
  if(!h){ tarjetaPrueba(c, e); return; }
  const sec = (t, x) => x ? `<section><h4>${t}</h4><p>${esc(x)}</p></section>` : '';
  const suerte = [
    h.numeros && lista(h.numeros).length ? `<span><b>Números</b>${esc(lista(h.numeros).join(', '))}</span>` : '',
    h.color ? `<span><b>Color</b>${esc(h.color)}</span>` : '',
    h.compat ? `<span><b>Compatible con</b>${esc(h.compat)}</span>` : ''
  ].join('');
  c.innerHTML = `<div class="horo">
    <div class="horo-cab"><div><div class="horo-signo">${esc(d.signo)}</div></div>
      ${h.clave ? `<div class="horo-clave">${esc(h.clave)}</div>` : ''}</div>
    ${h.general ? `<p class="horo-general">${esc(h.general)}</p>` : ''}
    <div class="horo-grid">${sec('Amor', h.amor)}${sec('Dinero y trabajo', h.dinero)}${sec('Salud', h.salud)}</div>
    ${suerte ? `<div class="horo-suerte">${suerte}</div>` : ''}
  </div>`;
  // Si el texto del día es más largo, reduce la letra hasta que quepa
  const el = c.firstChild;
  for(let k = 1; el.scrollHeight > el.clientHeight + 1 && k > .6; ){ k -= .05; el.style.setProperty('--k', k.toFixed(2)); }
}

/* ---------- Tipos de elemento ---------- */
// Cada tipo sabe crearse y actualizarse. Para un módulo nuevo solo se agrega aquí.
const TIPOS = {
  prueba: { crear: tarjetaPrueba, actualizar(c, e, nuevo){ if(nuevo) tarjetaPrueba(c, e); } },
  imagen: {
    crear(c){ c.innerHTML = '<img class="imagen" alt="">'; },
    actualizar(c, e){
      const img = c.firstChild;
      if(!e.visible || (c._img === e.imagen && img.getAttribute('src'))) return;
      c._img = e.imagen;
      srcRandom(e.imagen).then(src => { if(src && c._img === e.imagen) img.src = src; });
    },
    liberar(c){ c.firstChild.removeAttribute('src'); }
  },
  ruleta: { crear: crearRuleta, actualizar: actualizarRuleta },
  horoscopo: { crear: dibujarHoroscopo, actualizar(c, e, nuevo){ if(nuevo) dibujarHoroscopo(c, e); } },
  tirada: { crear: crearTirada, actualizar: actualizarTirada, liberar: liberarTirada },
  votacion: { crear: crearVotacion, actualizar: actualizarVotacion, liberar: liberarTirada },
  chat: { crear: crearChat, actualizar: actualizarChat, liberar: liberarChat },
  lista: { crear: dibujarLista, actualizar: dibujarLista }
};

const nodos = {}, ultimoT = {};
function detener(n){
  const c = n.firstChild; if(!c) return;
  if(c._ruleta) cancelAnimationFrame(c._ruleta.raf);
  if(c._tirada){ c._tirada.token++; c._tirada.timers.forEach(clearTimeout); }
}
function aplicar(){
  const todo = elementos || {};
  for(const id in nodos) if(!todo[id]){ detener(nodos[id]); nodos[id].remove(); delete nodos[id]; }
  for(const id in todo){
    const e = todo[id];
    if(!e || !e.w || !e.h) continue;
    let n = nodos[id];
    if(!n){
      n = document.createElement('div'); n.className = 'el';
      const cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
      n.append(cuerpo); escena.append(n); nodos[id] = n;
    }
    n.style.width = e.w + 'px';
    n.style.height = e.h + 'px';
    n.style.transform = `translate(${e.x - e.w / 2}px,${e.y - e.h / 2}px) rotate(${e.rot || 0}deg) scale(${e.escala ?? 1})`;
    n.style.opacity = e.opacidad ?? 1;
    n.style.zIndex = e.capa || 1;
    n.style.setProperty('--u', Math.min(e.w, e.h * 1.6) / 1000);

    const tipo = TIPOS[e.tipo] ? e.tipo : 'prueba', mod = TIPOS[tipo], cuerpo = n.firstChild;
    const t = (e.datos && e.datos.t) || 0, nuevo = t !== ultimoT[id];
    ultimoT[id] = t;
    if(n._tipo !== tipo){ detener(n); cuerpo.innerHTML = ''; mod.crear(cuerpo, e); n._tipo = tipo; }
    mod.actualizar(cuerpo, e, nuevo);

    if(e.visible){
      clearTimeout(n._liberar); n._liberar = 0;
      if(nuevo && t && n.classList.contains('on')){ n.classList.remove('on'); void n.offsetWidth; }
      n.classList.add('on');
    } else {
      n.classList.remove('on');
      if(!n._liberar && mod.liberar) n._liberar = setTimeout(() => { n._liberar = 0; mod.liberar(cuerpo); }, LIBERAR_MS);
    }
  }
}

// Redibuja las ruletas cuando termina de cargar la tipografía
if(document.fonts && document.fonts.load){
  document.fonts.load('800 40px "M PLUS Rounded 1c"').then(() => { fuentesListas = 1; aplicar(); }).catch(() => {});
}

aplicar();

if(FIREBASE_CONFIG.databaseURL && window.firebase){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  db.ref('.info/serverTimeOffset').on('value', s => { desfase = s.val() || 0; });
  // Solo se escucha la posición y el estado; las imágenes se piden una por una cuando se van a mostrar
  db.ref(`overlay/${sala}/elementos`).on('value', s => { elementos = s.val() || {}; aplicar(); }, err => console.error(err));
} else {
  // Modo local para pruebas en el mismo navegador que el panel
  try{
    elementos = JSON.parse(localStorage.getItem('bsx-estado-' + sala) || 'null') || elementos;
  }catch{}
  aplicar();
  const canal = new BroadcastChannel('bsx-' + sala);
  canal.onmessage = m => { elementos = m.data.elementos || {}; aplicar(); };
}
</script>
